[settings]
include = ["src/**/*.py", "tests/**/*.py"]
exclude = []
forbidden_subwords = [
    "data",
    "info",
    "item",
    "obj",
    "val",
    "temp",
    "mgr",
    "manager",
    "helper",
    "util",
    "stuff",
    "misc",
]

[replacements]
check = ["lint", "scan", "analyze", "inspect", "audit", "evaluate"]
resolve = ["find_files", "locate_files", "crawl", "discover"]
config = ["settings_obj", "options_map", "preferences"]
index = ["idx", "pos"]
error = ["err", "exc"]
