[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archcheck"
version = "0.1.0"
description = "Minimal zero-noise architecture checker CLI for agentic coding tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/philipp-vocal-logic/architecture-checker-cli"

[project.scripts]
architecture = "archcheck:main"

[dependency-groups]
dev = [
    "glossary-checker-cli",
    "pytest>=8.0",
    "ruff>=0.5",
    "symbol-checker-cli",
]

[tool.uv.sources]
glossary-checker-cli = { git = "https://github.com/philipp-vocal-logic/glossary-checker-cli.git", branch = "main" }
symbol-checker-cli = { git = "https://github.com/philipp-vocal-logic/symbol-checker-cli.git", branch = "main" }

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["archcheck"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
